<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>약속 남은 시간 계산기</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:50px;
}
input,button{
    font-size:18px;
    padding:8px;
}
#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<h2>약속 남은 시간 계산기</h2>

<input type="datetime-local" id="target">
<button onclick="calc()">계산</button>

<div id="result"></div>

<script>
function calc(){
    const target = new Date(document.getElementById("target").value);
    const now = new Date();

    const diff = target - now;

    if(isNaN(target.getTime())){
        document.getElementById("result").innerHTML="날짜와 시간을 입력하세요.";
        return;
    }

    if(diff < 0){
        document.getElementById("result").innerHTML="약속 시간이 이미 지났습니다.";
        return;
    }

    const minutes = Math.floor(diff / 1000 / 60);

    document.getElementById("result").innerHTML =
        "남은 시간 : <br><span style='color:blue'>" +
        minutes.toLocaleString() +
        "분</span>";
}
</script>

</body>
</html>
